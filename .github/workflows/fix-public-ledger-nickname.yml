name: Fix public ledger nickname

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update ledger renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("assets/js/script.js")
          lines = p.read_text(encoding="utf-8").splitlines()
          for i, line in enumerate(lines):
              if "script.supportLabel" in line and "ledger-row" in line:
                  lines[i:i+1] = [
                      '        const nickname = String(row.nickname || "Anonymous").trim() || "Anonymous";',
                      '        return `<div class="ledger-row"><time datetime="${row.paid_at || ""}">${dateText}</time><strong>+${formatEuro(amount)}</strong><span>${nickname}</span></div>`;'
                  ]
                  break
          else:
              raise SystemExit("Public ledger renderer not found")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/script.js
          git commit -m "fix: display contribution nicknames in public ledger"
          git rm .github/workflows/fix-public-ledger-nickname.yml
          git commit -m "chore: remove temporary nickname fix workflow"
          git push
