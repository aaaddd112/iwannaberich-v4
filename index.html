<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Donații & Monitorizare Reciclare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>EcoPlanet Dashboard</h1>
            <button id="openDonationModal" class="btn-primary">Donează Acum</button>
        </div>
    </header>

    <main class="container">
        <!-- Secțiune Calculator Reciclare -->
        <section class="calculator-section">
            <h2>Calculator Impact Reciclare</h2>
            <div class="form-group">
                <label for="plasticInput">Plastic colectat (kg):</label>
                <input type="number" id="plasticInput" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="paperInput">Hârtie/Carton colectat (kg):</label>
                <input type="number" id="paperInput" min="0" value="0">
            </div>
            <button id="calculateBtn" class="btn-secondary">Calculează Impact</button>
            <div id="calcResult" class="result-box"></div>
        </section>

        <!-- Secțiune Supabase Leaderboard -->
        <section class="leaderboard-section">
            <h2>Top Donatori (Supabase Realtime)</h2>
            <ul id="leaderboardList" class="leaderboard-key">
                <li>Se încarcă datele...</li>
            </ul>
        </section>
    </main>

    <!-- Modalul de Donații cu ID-ul reparat -->
    <div id="donationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Susține proiectele noastre</h3>
                <!-- Am adăugat id="closeDonationModal" pentru a rezolva eroarea din script.js -->
                <button class="modal-close" id="closeDonationModal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Alege suma pe care dorești să o donezi pentru plantarea de copaci:</p>
                <div class="donation-options">
                    <button class="btn-amount">20 RON</button>
                    <button class="btn-amount">50 RON</button>
                    <button class="btn-amount">100 RON</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
